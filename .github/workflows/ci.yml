name: CI
permissions: {}

on:
  pull_request:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci')"
    name: Run unit tests
    permissions:
      contents: read #Clone repo
      statuses: write # Update GitHub status check with deploy preview link.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
      - name: Install dependencies
        run: yarn install --frozen-lockfile --prefer-offline
      - name: Setup Go environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.22.4"
      - name: Test Backend
        run: yarn test:backend
  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile --prefer-offline
      - name: Build documentation website
        run: yarn docs:build --force
      - name: Make docs the homepage of the Developer Portal subsite
        run: |
          rm -f ./docusaurus/website/src/pages/index.tsx
          sed -i '1s/^/---\nslug: \/\n---\n/' ./docs/contract/contract.md
      - name: Build documentation website (Developer Portal)
        run: yarn docs:build:devportal:prod
